# Fallback renderer. The collector now cuts live clips from its ring buffer, so
# this job exists to rescue moments the live path missed:
#   - spikes detected between collector runs,
#   - live capture failures,
#   - clips whose render was abandoned.
# It uses the broadcaster's archive VOD, so it can also produce clips for a
# stream that has already ended.

name: ClipForge renderer (VOD fallback)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Needed only so a finished run can queue the next one.
permissions:
  contents: read
  actions: write

concurrency:
  group: clipforge-renderer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install agent dependencies
        run: cd agent && npm install --no-audit --no-fund

      - name: Build agent
        id: build
        run: cd agent && npm run build

      - name: Render queued clips
        working-directory: agent
        env:
          CLIPFORGE_BASE_URL: ${{ secrets.CLIPFORGE_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node dist/agent/src/renderer.js

      # The schedule trigger never fires here either, so each run waits out a
      # short interval and queues the next one. The renderer asks for no wait at
      # all when it actually had work, so a queued re-cut starts straight away
      # instead of sitting behind a four minute sleep.
      - name: Wait out the render interval
        if: always() && steps.build.outcome == 'success'
        run: |
          delay="${NEXT_RUN_DELAY:-240}"
          if [ "$delay" = "0" ]; then
            echo "queue had work - queueing the next run immediately"
          else
            echo "idle - waiting ${delay}s before the next run"
            sleep "$delay"
          fi

      - name: Queue the next render run
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh workflow run render.yml --ref "$BRANCH" \
            && echo "queued the next render run on $BRANCH" \
            || echo "could not queue the next run - dispatch it by hand"
