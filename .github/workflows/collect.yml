# Runs the Twitch chat collector in the cloud. No local machine involved.
#
# This job does two things at once:
#   1. watches chat and detects spikes, and
#   2. keeps a rolling ~3 minute HLS buffer per live channel in local temp disk,
#      so a detected spike can be cut and rendered immediately - while the
#      stream is still live - instead of waiting for the archive VOD.
#
# Coverage model: a run holds IRC connections for 5h45m and cron starts a new
# run every 6 hours, so there is roughly a 15 minute gap per rotation plus
# GitHub's cron delay. Jobs on a PUBLIC repository are free and unmetered; on a
# private repository the 2,000 free minutes/month cap applies - shorten
# RUN_SECONDS and the cron interval if this repo is private.

name: ClipForge collector

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: clipforge-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install agent dependencies
        run: cd agent && npm install --no-audit --no-fund

      - name: Build agent
        run: cd agent && npm run build

      - name: Collect chat and cut live clips
        working-directory: agent
        env:
          CLIPFORGE_BASE_URL: ${{ secrets.CLIPFORGE_BASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_BOT_LOGIN: ${{ secrets.TWITCH_BOT_LOGIN }}
          TWITCH_BOT_TOKEN: ${{ secrets.TWITCH_BOT_TOKEN }}
          RUN_SECONDS: "20700"
          MAX_CHANNELS: "5"
        run: node dist/agent/src/collector.js
